services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: love_bot_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d love_bot_test"]
      interval: 2s
      timeout: 3s
      retries: 30
