[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vgspu-love-bot"
version = "1.0.0"
description = "Анонимная предложка люблю | ВГСПУ"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.22,<4",
  "SQLAlchemy[asyncio]>=2.0.43,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.13,<1"]

[project.scripts]
love-bot = "love_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: requires a dedicated PostgreSQL database via TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
